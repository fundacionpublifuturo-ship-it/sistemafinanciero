function abonarCredito(id) {
  const c = S.credits.find(x => x.id === id);
  const bal = creditBalance(c);
  const cuota = (c.schedule || []).find(q => !q.paid);
  modal({
    title: 'Registrar abono · ' + c.code, ok: 'Guardar abono',
    body: `<div class="alertbox b" style="margin-bottom:14px"><div>Saldo actual <b>${money(bal)}</b>${cuota ? ` · próxima cuota ${money(cuota.amount)} el ${dmy(cuota.date)}` : ''}</div></div>

        <label class="field"><span>Valor del abono</span><input type="number" name="amount" min="0" value="${cuota ? cuota.amount : bal}"></label>

          <option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="tarjeta">Tarjeta</option></select></label></div>
      <div id="bkCr" style="display:none"><div class="row c2">

        <label class="field"><span>Comprobante <span class="hint">(opcional)</span></span><input type="text" name="ref"></label></div></div>`,
    onSubmit: f => {
      const amt = num(f.amount); if (amt <= 0) return toast('Valor inválido');
      (c.payments = c.payments || []).push({ date: today(), at: nowISO(), amount: amt, method: f.method, bank: f.banco, ref: f.ref });
      let rest = amt;
      (c.schedule || []).forEach(q => { if (!q.paid && rest >= q.amount) { q.paid = true; rest -= q.amount; } });
      refreshCreditStatus(c); save('credits'); closeModal(); render(); toast('Abono de ' + money(amt) + ' registrado');
    }
  });
}

      <td class="num strong down">${money(g.amount)}</td>
      <td><button class="btn sm danger" onclick="borrarGasto('${g.id}')">✕</button></td></tr>`).join('')
      || `<tr><td colspan="6"><div class="empty">${ico(I.gas, 34)}<h4>Sin gastos registrados</h4></div></td></tr>`}
    </tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>Gastos por categoría · mes actual</h3></div><div class="card-b" style="display:grid;gap:10px">
      ${porCat.map(([c, v]) => `<div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${esc(c)}</span><b>${money(v)}</b></div>
        <div style="height:6px;background:var(--line-2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${v / tot * 100}%;background:var(--blue)"></div></div></div>`).join('')
      || '<div class="tiny muted">Sin gastos este mes</div>'}
    </div></div>
  </div>`;
};
function nuevoGasto() {
  modal({
    title: 'Registrar gasto', ok: 'Guardar gasto',
    body: `<div class="row c2">
      <label class="field"><span>Categoría</span><select name="category">${opt(CAT_GASTO)}</select></label>
      <label class="field"><span>Fecha</span><input type="date" name="date" value="${today()}"></label></div>
      <label class="field"><span>Concepto *</span><input type="text" name="concept" placeholder="Ej: Recarga de bolsas y empaques"></label>
      <div class="row c2">
        <label class="field"><span>Valor *</span><input type="number" name="amount" min="0" value="0"></label>
        <label class="field"><span>Medio de pago</span><select name="method"><option value="efectivo">Efectivo (sale de caja)</option><option value="transferencia">Transferencia</option><option value="tarjeta">Tarjeta</option></select></label></div>
      <label class="field"><span>Proveedor</span><input type="text" name="provider"></label>
      <label class="field"><span>Comprobante <span class="hint">(opcional)</span></span><input type="text" name="ref"></label>`,
    onSubmit: f => {
      if (num(f.amount) <= 0) return toast('Valor inválido');
      S.expenses.unshift({ id: uid('gt'), code: consec('GT'), date: f.date, at: nowISO(), category: f.category, concept: f.concept || 'Gasto', amount: num(f.amount), method: f.method, provider: f.provider, ref: f.ref });
      save('expenses'); closeModal(); render(); toast('Gasto registrado');
    }
  });
}
function borrarGasto(id) { S.expenses = S.expenses.filter(g => g.id !== id); save('expenses'); render(); toast('Gasto eliminado'); }

/* ============================================================
   REPORTES
   ============================================================ */
let rFrom = monthKey(today()) + '-01', rTo = today();
VIEWS.reportes = () => {
  const ventas = S.sales.filter(v => v.date >= rFrom && v.date <= rTo && v.status !== 'anulada');
  const servs = S.services.filter(s => s.deliveredAt && String(s.deliveredAt).slice(0, 10) >= rFrom && String(s.deliveredAt).slice(0, 10) <= rTo);
  const gastos = S.expenses.filter(g => g.date >= rFrom && g.date <= rTo);
  const gp = grossProfit(rFrom, rTo);
  const totG = gastos.reduce((a, g) => a + g.amount, 0);
  const neta = gp.gross - totG;

  const metodos = {};
  ventas.forEach(v => (v.payments || []).forEach(p => metodos[p.method] = (metodos[p.method] || 0) + p.amount));
  const top = {};
  ventas.forEach(v => (v.items || []).forEach(i => {
    top[i.name] = top[i.name] || { q: 0, v: 0, g: 0 };
    top[i.name].q += i.qty; top[i.name].v += i.qty * i.price; top[i.name].g += i.qty * (i.price - (i.cost || 0));
  }));
  const topArr = Object.entries(top).sort((a, b) => b[1].v - a[1].v).slice(0, 10);
  const totMet = Object.values(metodos).reduce((a, b) => a + b, 0) || 1;

  return `
  <div class="toolbar">
    <label class="field" style="margin:0"><span>Desde</span><input type="date" value="${rFrom}" onchange="rFrom=this.value;render()"></label>
    <label class="field" style="margin:0"><span>Hasta</span><input type="date" value="${rTo}" onchange="rTo=this.value;render()"></label>
    <div style="flex:1"></div>
    <button class="btn" onclick="exportCSV('ventas')">Exportar ventas</button>
    <button class="btn" onclick="backupJSON()">Copia de seguridad</button>
    <button class="btn" onclick="window.print()">Imprimir</button>
  </div>

  <div class="kpis" style="margin-bottom:15px">
    <div class="kpi hero"><div class="lab">Ingresos del periodo</div><div class="val">${money(gp.rev)}</div>
      <div class="sub">${ventas.length} ventas · ${servs.length} órdenes entregadas</div></div>
    <div class="kpi"><div class="lab">Costo de lo vendido</div><div class="val">${money(gp.cost)}</div><div class="sub">productos y repuestos</div></div>
    <div class="kpi"><div class="lab">Utilidad bruta</div><div class="val up">${money(gp.gross)}</div><div class="sub">${gp.rev ? Math.round(gp.gross / gp.rev * 100) : 0}% de margen</div></div>
    <div class="kpi"><div class="lab">Gastos operativos</div><div class="val down">${money(totG)}</div><div class="sub">${gastos.length} registros</div></div>
    <div class="kpi"><div class="lab">Utilidad neta</div><div class="val ${neta >= 0 ? 'up' : 'down'}">${money(neta)}</div><div class="sub">después de gastos</div></div>
  </div>

  <div class="row c2" style="align-items:start">
    <div class="card"><div class="card-h"><h3>Productos y servicios más vendidos</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Producto</th><th class="num">Unid.</th><th class="num">Ventas</th><th class="num">Utilidad</th></tr></thead><tbody>
      ${topArr.map(([n, d], i) => `<tr><td class="muted">${i + 1}</td><td class="strong">${esc(n)}</td><td class="num">${d.q}</td>
        <td class="num">${money(d.v)}</td><td class="num up">${money(d.g)}</td></tr>`).join('')
      || '<tr><td colspan="5" class="muted" style="padding:20px;text-align:center">Sin ventas en el periodo</td></tr>'}
      </tbody></table></div></div>

    <div class="card"><div class="card-h"><h3>Recaudo por medio de pago</h3></div><div class="card-b" style="display:grid;gap:11px">
      ${Object.entries(metodos).sort((a, b) => b[1] - a[1]).map(([m, v]) => `<div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span style="text-transform:capitalize">${esc(m)}</span><b>${money(v)}</b></div>
        <div style="height:7px;background:var(--line-2);border-radius:4px;overflow:hidden"><div style="height:100%;width:${v / totMet * 100}%;background:linear-gradient(90deg,var(--blue),var(--blue-bright))"></div></div></div>`).join('')
      || '<div class="tiny muted">Sin datos en el periodo</div>'}
      <div style="border-top:1px solid var(--line-2);padding-top:11px;margin-top:4px">
        <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">Cierres de caja en el periodo</span>
          <b>${S.cashdays.filter(c => c.closedAt && c.id >= rFrom && c.id <= rTo).length}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:5px"><span class="muted">Descuadres acumulados</span>
          <b class="${S.cashdays.filter(c => c.closedAt && c.id >= rFrom && c.id <= rTo).reduce((a, c) => a + c.diff, 0) ? 'down' : ''}">${money(S.cashdays.filter(c => c.closedAt && c.id >= rFrom && c.id <= rTo).reduce((a, c) => a + c.diff, 0))}</b></div>
      </div>
    </div></div>
  </div>`;
};

/* --- exportación --- */
function dl(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function toCSV(rows) { return '\uFEFF' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n'); }
function exportCSV(kind) {
  let rows = [];
  if (kind === 'inventario') { rows = [['Código', 'Producto', 'Categoría', 'Costo', 'Precio', 'Stock', 'Mínimo', 'Vendidos', 'Última recarga', 'Proveedor']]; S.products.forEach(p => rows.push([p.code, p.name, p.category, p.cost, p.price, p.stock, p.min, p.sold || 0, p.lastRestock, p.supplier || ''])); }
  if (kind === 'clientes') { rows = [['Nombre', 'Teléfono', 'Documento', 'Correo', 'Compras', 'Total gastado', 'Última compra']]; S.clients.forEach(c => rows.push([c.name, c.phone, c.doc, c.email || '', c.purchases || 0, c.spent || 0, c.last || ''])); }
  if (kind === 'gastos') { rows = [['Fecha', 'Categoría', 'Concepto', 'Proveedor', 'Medio', 'Valor']]; S.expenses.forEach(g => rows.push([g.date, g.category, g.concept, g.provider || '', g.method, g.amount])); }
  if (kind === 'ventas') {
    rows = [['Código', 'Fecha', 'Cliente', 'Vendedor', 'Subtotal', 'Descuento', 'Total', 'Medios de pago']];
    S.sales.filter(v => v.date >= rFrom && v.date <= rTo).forEach(v => rows.push([v.code, v.date, v.clientName, v.seller || '', v.subtotal, v.discount, v.total, (v.payments || []).map(p => p.method + ':' + p.amount).join(' | ')]));
  }
  dl(kind + '_' + today() + '.csv', toCSV(rows), 'text/csv;charset=utf-8');
  toast('Archivo descargado');
}
function backupJSON() { dl('backup_' + S.config.biz.replace(/\s+/g, '_') + '_' + today() + '.json', JSON.stringify(S, null, 2), 'application/json'); toast('Copia de seguridad descargada'); }

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
VIEWS.config = () => `
  <div class="row c2" style="align-items:start">
    <div class="card"><div class="card-h"><h3>Datos del negocio</h3></div><div class="card-b">
      <label class="field"><span>Nombre del negocio</span><input type="text" id="cBiz" value="${esc(S.config.biz)}"></label>
      <label class="field"><span>Descripción corta <span class="hint">(aparece bajo el logo)</span></span><input type="text" id="cSub" value="${esc(S.config.sub)}"></label>
      <div class="row c2">
        <label class="field"><span>NIT / CC</span><input type="text" id="cNit" value="${esc(S.config.nit)}"></label>
        <label class="field"><span>Teléfono</span><input type="text" id="cTel" value="${esc(S.config.tel)}"></label></div>
      <div class="row c2">
        <label class="field"><span>Dirección</span><input type="text" id="cDir" value="${esc(S.config.dir)}"></label>
        <label class="field"><span>Ciudad</span><input type="text" id="cCiu" value="${esc(S.config.ciudad)}"></label></div>
      <div class="row c2">
        <label class="field"><span>Usuario actual</span><input type="text" id="cUser" value="${esc(S.config.user)}"></label>
        <label class="field"><span>Rol</span><select id="cRole">${opt(['Dueño', 'Administrador', 'Cajero', 'Técnico', 'Vendedor'], S.config.role)}</select></label></div>
      <button class="btn primary" onclick="guardarConfig()">Guardar cambios</button>
    </div></div>

    <div class="grid">
      <div class="card"><div class="card-h"><h3>Módulos activos</h3></div><div class="card-b">
        <p class="tiny muted" style="margin-top:0">Activa solo lo que tu negocio usa. Los módulos apagados desaparecen del menú.</p>
        ${[['modServicios', 'Órdenes de servicio', 'Para talleres, técnicos, agencias y servicios'],
    ['modProductos', 'Punto de venta e inventario', 'Para tiendas y negocios con productos físicos'],
    ['modCreditos', 'Separados y créditos', 'Financiación y apartados de clientes'],
    ['modMayoristas', 'Cuentas mayoristas', 'Clientes B2B con cupo y plazo']].map(([k, t, d]) =>
      `<label style="display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer">
            <input type="checkbox" style="width:auto;margin-top:3px" ${S.config[k] ? 'checked' : ''} onchange="S.config['${k}']=this.checked;save('config');render()">
            <div><div class="strong">${t}</div><div class="tiny muted">${d}</div></div></label>`).join('')}
        <label class="field" style="margin-top:14px"><span>Cómo llamas a tus órdenes</span>
          <input type="text" value="${esc(S.config.serviceLabel)}" onchange="S.config.serviceLabel=this.value||'Órdenes de Servicio';save('config');render()" placeholder="Ej: Órdenes de Servicio, Pedidos, Proyectos"></label>
      </div></div>

      <div class="card"><div class="card-h"><h3>Parámetros financieros</h3></div><div class="card-b">
        <div class="row c2">
          <label class="field"><span>IVA aplicado (%)</span><input type="number" id="cIva" value="${S.config.iva}" min="0" max="100"></label>
          <label class="field"><span>Meta de ventas del mes</span><input type="number" id="cMeta" value="${S.config.metaMes}" min="0"></label></div>
        <label class="field"><span>Equipo / responsables <span class="hint">(separados por coma)</span></span>
          <input type="text" id="cTec" value="${esc(S.config.tecnicos.join(', '))}"></label>
        <button class="btn primary" onclick="guardarConfig()">Guardar cambios</button>
      </div></div>

      <div class="card"><div class="card-h"><h3>Datos y respaldo</h3></div><div class="card-b">
        <p class="tiny muted" style="margin-top:0">Descarga una copia completa o restaura desde un respaldo anterior.</p>
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn" onclick="backupJSON()">Descargar copia</button>
          <label class="btn" style="cursor:pointer">Restaurar copia<input type="file" accept="application/json" style="display:none" onchange="restoreJSON(this)"></label>
          <button class="btn danger" onclick="borrarTodo()">Borrar todos los datos</button>
        </div>
        <div class="tiny muted" style="margin-top:12px">Registros: ${S.products.length} productos · ${S.clients.length} clientes · ${S.sales.length} ventas · ${S.services.length} órdenes · ${S.credits.length} créditos · ${S.cashdays.length} cierres</div>
      </div></div>
    </div>
  </div>`;
function guardarConfig() {
  Object.assign(S.config, {
    biz: $('#cBiz')?.value || S.config.biz, sub: $('#cSub')?.value || '', nit: $('#cNit')?.value || '',
    tel: $('#cTel')?.value || '', dir: $('#cDir')?.value || '', ciudad: $('#cCiu')?.value || '',
    user: $('#cUser')?.value || S.config.user, role: $('#cRole')?.value || S.config.role,
    iva: num($('#cIva')?.value), metaMes: num($('#cMeta')?.value),
    tecnicos: ($('#cTec')?.value || 'Sin asignar').split(',').map(t => t.trim()).filter(Boolean)
  });
  save('config'); render(); toast('Configuración guardada');
}
function restoreJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); KEYS.forEach(k => { if (d[k] !== undefined) S[k] = d[k]; }); save(); render(); toast('Copia restaurada'); }
    catch (e) { toast('El archivo no es válido'); }
  };
  r.readAsText(f);
}
function borrarTodo() {
  modal({
    title: 'Borrar todos los datos', ok: 'Sí, borrar todo',
    body: `<div class="alertbox r"><div>Se eliminarán productos, clientes, ventas, órdenes, créditos y cierres de caja. Esta acción no se puede deshacer. Descarga una copia antes si la necesitas.</div></div>`,
    onSubmit: () => { S = JSON.parse(JSON.stringify(DEFAULTS)); save(); closeModal(); render(); toast('Datos borrados'); }
  });
}

/* ============================================================
   ARRANQUE
   ============================================================ */
$('#menuBtn').onclick = () => {
  $('#sidebar').classList.add('open');
  const s = document.createElement('div'); s.className = 'scrim-nav';
  s.onclick = () => { $('#sidebar').classList.remove('open'); s.remove(); };
  document.body.appendChild(s);
};
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('pf_theme', next); } catch (e) { }
};
try { const t = localStorage.getItem('pf_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { }

function hideSplash() { const s = $('#splash'); if (s) { s.classList.add('gone'); setTimeout(() => s.remove(), 600); } }
render();
initStore().then(() => { render(); setTimeout(hideSplash, 350); });
setTimeout(hideSplash, 4000);

</script>
</body>

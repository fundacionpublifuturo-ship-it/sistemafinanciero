      <p class="tiny muted" style="margin-top:0">Enciende solo lo que usas, cámbiale el nombre y el emoji, y ordénalo como quieras.</p>
      <div id="menuList">${menuListHTML()}</div></div></div>

    <div class="card"><div class="card-h"><h3><span class="em">🧮</span>Parámetros financieros</h3></div><div class="card-b">
      <div class="row c3"><label class="field"><span>IVA aplicado (%)</span><input type="number" id="cIva" value="${S.config.iva}" min="0" max="100"></label>
        <label class="field"><span>Meta de ventas del mes</span>${mnyInput('metaMes', S.config.metaMes)}</label>
        <label class="field"><span>Prefijo de códigos</span><input type="text" id="cPref" value="${esc(S.config.prefijoSKU)}" maxlength="4" placeholder="REF"></label></div>
      <div class="alertbox b"><span class="em">🔢</span><div>Ejemplo de código automático: <b>${esc(skuStr('Anillos'))}</b></div></div>
      <button class="btn primary" style="margin-top:14px" onclick="guardarConfig()">Guardar cambios</button></div></div>

    <div class="card"><div class="card-h"><h3><span class="em">💾</span>Datos y respaldo</h3></div><div class="card-b">
      <p class="tiny muted" style="margin-top:0">Descarga una copia completa (incluye las fotos) o restaura desde un respaldo anterior.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn" onclick="backupJSON()">💾 Descargar copia</button>
        <label class="btn" style="cursor:pointer">📤 Restaurar copia<input type="file" accept="application/json" style="display:none" onchange="restoreJSON(this)"></label>
        <button class="btn danger" onclick="borrarTodo()">🗑️ Borrar todo</button></div>
      <div class="tiny muted" style="margin-top:14px">${nfmt(S.products.length)} productos · ${nfmt(S.clients.length)} clientes · ${nfmt(S.sales.length)} ventas ·
        ${nfmt(S.services.length)} órdenes · ${nfmt(S.credits.length)} créditos · ${nfmt(S.cashdays.length)} cierres · ${nfmt(S.campaigns.length)} campañas</div></div></div>
  </div></div>`;
const respListHTML = () => (S.config.responsables || []).length
  ? S.config.responsables.map(r => `<div class="sortrow"><span class="av" style="width:30px;height:30px;font-size:11px">${ini(r)}</span>
      <div style="flex:1"><b>${esc(r)}</b><div class="tiny muted">${nfmt(S.services.filter(s => s.assigned === r).length)} orden(es) asignada(s)</div></div>
      <button class="btn sm" onclick="renResp(${JSON.stringify(r)})">✏️</button>
      <button class="btn sm danger" onclick="delResp(${JSON.stringify(r)})">🗑️</button></div>`).join('')
  : `<div class="empty" style="padding:22px"><span class="em">🙋</span><h4>Sin responsables</h4><p class="tiny">Crea el primero arriba.</p></div>`;
function crearResp() {
  const v = $('#newResp').value.trim(); if (!v) return;
  if ((S.config.responsables || []).includes(v)) return toast('Ya existe', '⚠️');
  S.config.responsables = [...(S.config.responsables || []), v]; save('config');
  $('#newResp').value = ''; $('#respList').innerHTML = respListHTML(); toast('Responsable creado', '🙋');
}
function renResp(r) {
  const v = prompt('Nuevo nombre:', r); if (!v || !v.trim() || v === r) return;
  S.config.responsables = S.config.responsables.map(x => x === r ? v.trim() : x);
  S.services.forEach(s => { if (s.assigned === r) s.assigned = v.trim(); });
  save('config', 'services'); $('#respList').innerHTML = respListHTML(); toast('Actualizado', '✏️');
}
function delResp(r) {
  S.config.responsables = S.config.responsables.filter(x => x !== r);
  save('config'); $('#respList').innerHTML = respListHTML(); toast('Eliminado', '🗑️');
}
const menuListHTML = () => (S.config.menu || []).map((m, i) => `<div class="sortrow">
  <button class="btn ghost sm" onclick="moveMenu(${i},-1)" ${i === 0 ? 'disabled' : ''}>▲</button>
  <button class="btn ghost sm" onclick="moveMenu(${i},1)" ${i === S.config.menu.length - 1 ? 'disabled' : ''}>▼</button>
  <input type="text" value="${esc(m.em)}" maxlength="3" style="width:46px;text-align:center;padding:6px" onchange="S.config.menu[${i}].em=this.value||'•';save('config');render()">
  <input type="text" value="${esc(m.label)}" style="flex:1" onchange="S.config.menu[${i}].label=this.value||'Sección';save('config');render()">
  ${m.fixed ? '<span class="tag n">fija</span>' : `<label class="sw"><input type="checkbox" ${m.on !== false ? 'checked' : ''} onchange="S.config.menu[${i}].on=this.checked;save('config');render()"><i></i></label>`}
</div>`).join('');
function moveMenu(i, d) {
  const m = S.config.menu, j = i + d; if (j < 0 || j >= m.length) return;
  [m[i], m[j]] = [m[j], m[i]]; save('config'); render();
}
function guardarConfig() {
  Object.assign(S.config, {
    biz: $('#cBiz')?.value.trim() || S.config.biz, sub: $('#cSub')?.value || '', nit: $('#cNit')?.value || '',
    tel: $('#cTel')?.value || '', wa: $('#cWa')?.value || '', dir: $('#cDir')?.value || '', ciudad: $('#cCiu')?.value || '',
    user: $('#cUser')?.value || '', role: $('#cRole')?.value || S.config.role,
    iva: Number($('#cIva')?.value) || 0, metaMes: numCO($('[name=metaMes]')?.value), prefijoSKU: ($('#cPref')?.value || 'REF').toUpperCase()
  });
  save('config'); render(); toast('Configuración guardada', '⚙️');
}
function restoreJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      KEYS.forEach(k => { if (d[k] !== undefined) S[k] = d[k]; });
      if (d._images) for (const [id, v] of Object.entries(d._images)) await imgSet(id, v);
      save(); render(); toast('Copia restaurada', '📤');
    } catch (e) { toast('El archivo no es válido', '⚠️'); }
  };
  r.readAsText(f);
}
function borrarTodo() {
  modal({
    title: 'Borrar todos los datos', em: '⚠️', ok: 'Sí, borrar todo',
    body: `<div class="alertbox r"><span class="em">🚨</span><div>Se eliminarán productos, fotos, clientes, ventas, órdenes, créditos, campañas y cierres de caja. No se puede deshacer. Descarga una copia antes si la necesitas.</div></div>`,
    onSubmit: async () => {
      for (const id of Object.keys(IMG)) await imgDel(id);
      S = JSON.parse(JSON.stringify(DEFAULTS)); save(); closeModal(); render(); toast('Datos borrados', '🗑️');
    }
  });
}

/* ---------------- ARRANQUE ---------------- */
$('#menuBtn').onclick = () => {
  $('#sidebar').classList.add('open');
  const s = document.createElement('div'); s.className = 'scrim-nav';
  s.onclick = () => { $('#sidebar').classList.remove('open'); s.remove(); };
  document.body.appendChild(s);
};
$('#themeBtn').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('pf_theme', next); } catch (e) { }
};
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('pf_theme') || 'light'); } catch (e) { }
const bn = $('#bizName');
bn.addEventListener('blur', () => { const v = bn.textContent.trim(); if (v && v !== S.config.biz) { S.config.biz = v; save('config'); toast('Nombre actualizado', '🏪'); render(); } else bn.textContent = S.config.biz; });
bn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); bn.blur(); } if (e.key === 'Escape') { bn.textContent = S.config.biz; bn.blur(); } });
function hideSplash() { const s = $('#splash'); if (s) { s.classList.add('gone'); setTimeout(() => s.remove(), 700); } }
render();
initStore().then(() => { render(); setTimeout(hideSplash, 380); });
setTimeout(hideSplash, 5000);

</script>
</body>
</html>

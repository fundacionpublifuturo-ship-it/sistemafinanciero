function verGarantia(id) {
  const w = S.warranties.find(x => x.id === id); if (!w) return;
  const flow = ['recibida', 'revision', 'aprobada', 'entregada'], idx = flow.indexOf(w.status);
  modal({ title: w.code + ' · ' + w.clientName, em: '🛡️', wide: true,
    body: `<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px"><span class="tag ${EST_GAR[w.status].c}">${EST_GAR[w.status].e} ${EST_GAR[w.status].t}</span>
      <span class="tag n">${w.type === 'producto' ? '📦 Producto' : '🔧 Servicio'}</span><span class="tiny muted">Recibida ${dmy(w.date)} · ${esc(w.ref || 'sin referencia')} · ${esc(w.assigned || 'sin responsable')} · ${nfmt(w.days)} días</span></div>

      <div class="card"><div class="card-b"><div class="totals" style="border:0;padding:0;margin:0"><div><span>Costo interno</span><span class="strong">${money(w.cost || 0)}</span></div><div><span>Cliente</span><span>${esc(w.phone || '')}</span></div></div></div></div></div>
      <div class="card"><div class="card-h"><h3><span class="em">🕘</span>Historial</h3></div><div class="card-b" style="display:grid;gap:6px">${(w.history || []).map(h => `<div class="tiny"><span class="muted">${dmy(h.at)} ${hm(h.at)}</span> — ${esc(h.t)}</div>`).join('')}</div></div>`,
    footer: `${w.status !== 'rechazada' && w.status !== 'entregada' ? `<button class="btn danger" onclick="resolverGarantia('${w.id}','rechazada')">❌ Rechazar</button>` : ''}<div class="spacer"></div>
      ${w.phone ? `<button class="btn wa-btn" onclick="waGarantia('${w.id}')">💬 WhatsApp</button>` : ''}
      ${idx >= 0 && idx < 3 ? `<button class="btn primary" onclick="${flow[idx + 1] === 'aprobada' ? `resolverGarantia('${w.id}','aprobada')` : `estadoGarantia('${w.id}','${flow[idx + 1]}')`}">Pasar a ${EST_GAR[flow[idx + 1]].t}</button>` : ''}` });
}
function waGarantia(id) { const w = S.warranties.find(x => x.id === id); window.open(waLink(w.phone, `¡Hola ${w.clientName}! 👋\n\nLe informamos de *${S.config.biz}*:\n\n🛡️ Garantía *${w.code}*\n📦 ${w.item}\n📌 Estado: *${EST_GAR[w.status].t}*${w.resolution ? '\n✅ ' + w.resolution : ''}\n\n¡Gracias por su confianza! 🙌`), '_blank'); }
function estadoGarantia(id, st) { const w = S.warranties.find(x => x.id === id); w.status = st; (w.history = w.history || []).push({ at: nowISO(), t: 'Estado: ' + EST_GAR[st].t }); if (st === 'entregada') w.deliveredAt = nowISO(); save('warranties'); closeModal(); render(); toast('Garantía actualizada', EST_GAR[st].e); }
function resolverGarantia(id, st) {
  const w = S.warranties.find(x => x.id === id);

    body: `${st === 'aprobada' ? `<label class="field"><span>Resolución</span><select name="resolution"><option>Reparación sin costo</option><option>Cambio por producto nuevo</option><option>Devolución del dinero</option><option>Nota crédito</option><option>Reproceso del servicio</option></select></label>
      <label class="field"><span>Producto entregado a cambio <span class="hint">(opcional — sí descuenta inventario)</span></span><select name="swapId"><option value="">Ninguno</option>${S.products.filter(p => p.stock > 0).map(p => `<option value="${p.id}">${esc(p.code + ' · ' + p.name)} (${nfmt(p.stock)})</option>`).join('')}</select></label>` : ''}

      <label class="field"><span><input type="checkbox" name="asExpense" checked style="width:auto;margin-right:7px">Registrar el costo como gasto</span></label>
      <label class="field"><span>Observación</span><textarea name="resNote"></textarea></label>`,
    onSubmit: f => {
      w.status = st; w.resolution = st === 'aprobada' ? f.resolution : 'Rechazada'; w.resNote = f.resNote; w.cost = f.cost;

      if (f.swapId) { const p = S.products.find(x => x.id === f.swapId); if (p) { p.stock = Math.max(0, p.stock - 1); kardexLog(p.id, 'garantia', -1, w.code, 'Cambio por garantía', p.cost); w.history.push({ at: nowISO(), t: 'Se descontó 1 × ' + p.name + ' del inventario' }); } }
      if (f.asExpense && f.cost > 0) S.expenses.unshift({ id: uid('gt'), code: consec('GT'), date: today(), at: nowISO(), category: 'Otros', concept: 'Garantía ' + w.code + ' · ' + w.item, amount: f.cost, method: 'efectivo', provider: '' });
      save('warranties', 'products', 'kardex', 'expenses'); closeModal(); render(); toast('Garantía ' + (st === 'aprobada' ? 'aprobada' : 'rechazada'), st === 'aprobada' ? '✅' : '❌');
    } });
}
DOCS.garantias = () => ({ title: 'Informe de garantías', subtitle: 'Todas las garantías registradas', orientation: 'l', columns: ['Código', 'Fecha', 'Tipo', 'Cliente', 'Teléfono', 'Referencia', 'Ítem', 'Falla', 'Responsable', 'Estado', 'Resolución', 'Costo'],

let capId = null, capQ = '', capCat = 'Todas';
VIEWS.capturador = () => {
  const c = capId && S.captures.find(x => x.id === capId);
  if (!c) return `<div class="row c2" style="align-items:start"><div class="card"><div class="card-b" style="text-align:center;padding:36px 24px">
      <div style="font-size:44px;animation:bob 3s ease-in-out infinite">📋</div><h3 style="font-family:var(--disp);margin:12px 0 6px;font-size:18px">Inventario físico</h3>
      <p class="muted tiny" style="max-width:360px;margin:0 auto 18px">Cuenta lo que hay en las estanterías, compara contra el sistema y aplica las tarjetas capturadas al kardex de tres formas: modificar, sumar o inicializar.</p>
      <button class="btn primary" onclick="nuevaCaptura()">➕ Iniciar captura</button></div></div>
    <div class="card"><div class="card-h"><h3><span class="em">🗂️</span>Capturas anteriores</h3></div><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>Responsable</th><th class="num">Ref.</th><th>Estado</th><th></th></tr></thead><tbody>
      ${S.captures.map(x => `<tr><td class="tiny">${dmy(x.date)}</td><td class="strong">${esc(x.name)}</td><td class="tiny">${esc(x.who || '')}</td><td class="num">${nfmt(Object.keys(x.counts || {}).length)}</td>
        <td>${x.applied ? `<span class="tag g">Aplicada · ${esc(x.mode)}</span>` : '<span class="tag y">Abierta</span>'}</td><td><button class="btn sm" onclick="capId='${x.id}';render()">${x.applied ? 'Ver' : 'Continuar'}</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted" style="padding:20px;text-align:center">Sin capturas</td></tr>'}</tbody></table></div></div></div>`;
  const cats = ['Todas', ...(S.config.categorias || [])];
  const list = S.products.filter(p => (capCat === 'Todas' || p.category === capCat) && (!capQ || (p.name + p.code + (p.brand || '')).toLowerCase().includes(capQ.toLowerCase())));
  const counted = Object.keys(c.counts || {}).length, diffs = S.products.filter(p => p.id in (c.counts || {}) && c.counts[p.id] !== p.stock);
  const dv = diffs.reduce((a, p) => a + (c.counts[p.id] - p.stock) * (p.cost || 0), 0);
  window._cap = c;
  return `<div class="kpis" style="margin-bottom:15px">
    <div class="kpi hero"><div class="lab"><span class="em">📋</span>${esc(c.name)}</div><div class="val">${nfmt(counted)} / ${nfmt(S.products.length)}</div><div class="sub">referencias contadas · ${esc(c.who || '')} · ${dmy(c.date)}</div></div>
    <div class="kpi"><div class="lab"><span class="em">⚖️</span>Con diferencia</div><div class="val ${diffs.length ? 'down' : 'up'}">${nfmt(diffs.length)}</div><div class="sub">contado ≠ sistema</div></div>
    <div class="kpi"><div class="lab"><span class="em">💰</span>Ajuste a costo</div><div class="val ${dv < 0 ? 'down' : 'up'}">${money(dv)}</div><div class="sub">${dv < 0 ? 'pérdida de inventario' : 'sobrante'}</div></div>
    <div class="kpi"><div class="lab"><span class="em">${c.applied ? '✅' : '⏳'}</span>Estado</div><div class="val" style="font-size:18px">${c.applied ? 'Aplicada (' + esc(c.mode) + ')' : 'Abierta'}</div></div></div>
  <div class="toolbar"><button class="btn" onclick="capId=null;render()">← Capturas</button>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="text" id="capq" placeholder="Buscar o escanear + Enter" value="${esc(capQ)}" oninput="capQ=this.value;render()" onkeydown="if(event.key==='Enter')capScan(this.value)"></div>
    <select style="width:auto" onchange="capCat=this.value;render()">${opt(cats, capCat)}</select><div class="spacer"></div>
    ${exportBtns('captura')}${!c.applied ? `<button class="btn primary" onclick="aplicarCaptura()" ${counted ? '' : 'disabled'}>✅ Aplicar a tarjetas</button>` : ''}</div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th></th><th>Referencia</th><th>Producto</th><th class="num">Sistema</th><th class="num" style="width:130px">Contado</th><th class="num">Diferencia</th><th class="num">Valor dif.</th></tr></thead><tbody>
  ${list.map(p => { const has = p.id in (c.counts || {}), cnt = has ? c.counts[p.id] : null, d = has ? cnt - p.stock : 0;
    return `<tr style="${has ? (d ? 'background:var(--warn-bg)' : 'background:var(--ok-bg)') : ''}"><td style="width:42px"><div style="width:34px;height:34px;border-radius:8px;overflow:hidden;background:var(--grad-soft);display:grid;place-items:center">${thumb(p)}</div></td>
      <td class="tiny strong">${esc(p.code)}</td><td>${esc(p.name)}<div class="tiny muted">${esc(p.category || '')}</div></td><td class="num">${nfmt(p.stock)}</td>
      <td class="num"><input type="number" min="0" value="${has ? cnt : ''}" placeholder="—" style="text-align:center;padding:6px" ${c.applied ? 'disabled' : ''} onchange="setCount('${p.id}',this.value)"></td>
      <td class="num strong ${d < 0 ? 'down' : d > 0 ? 'up' : ''}">${has ? (d > 0 ? '+' : '') + nfmt(d) : '—'}</td><td class="num ${d < 0 ? 'down' : ''}">${has ? money(d * (p.cost || 0)) : '—'}</td></tr>`; }).join('')}</tbody></table></div></div>`;
};
VIEWS.after_capturador = () => keepFocus('#capq');
function nuevaCaptura() {
  modal({ title: 'Iniciar captura de inventario', em: '📋', ok: 'Iniciar', body: `<label class="field"><span>Nombre</span><input type="text" name="name" value="Inventario ${dmy(today())}"></label><label class="field"><span>Responsable</span>${selResp('who', S.config.user)}</label>`,
    onSubmit: f => { const c = { id: uid('cp'), code: consec('CP'), name: f.name || 'Inventario', who: f.who, date: today(), at: nowISO(), counts: {}, applied: false }; S.captures.unshift(c); capId = c.id; save('captures'); closeModal(); render(); } });
}
function setCount(pid, v) { const c = window._cap; if (!c) return; if (v === '') delete c.counts[pid]; else c.counts[pid] = Math.max(0, Number(v) || 0); save('captures'); render(); }
function capScan(v) { const p = S.products.find(x => x.code.toLowerCase() === v.trim().toLowerCase()); if (p) { const c = window._cap; c.counts[p.id] = (c.counts[p.id] || 0) + 1; capQ = ''; save('captures'); render(); toast(p.name + ' → ' + nfmt(c.counts[p.id]), '📋'); $('#capq')?.focus(); } }
function aplicarCaptura() {
  const c = window._cap; if (!c) return;
  modal({ title: 'Aplicar las tarjetas capturadas al kardex', em: '⚠️', ok: 'Aplicar a tarjetas',
    body: `<div class="opt-grid">${[['modificar', '✏️', 'Modificar las capturadas', 'La existencia de cada referencia contada pasa a ser el valor contado. Las no contadas no cambian.'],
      ['sumar', '➕', 'Sumar a las existencias', 'Lo contado se suma a lo que ya hay (útil al recibir mercancía por lotes).'],
      ['inicializar', '🔄', 'Inicializar inventario', 'Pone TODO en cero y luego fija las capturadas. Las no contadas quedan en 0.']].map(([k, e, t, d], i) => `<label class="opt ${i === 0 ? 'on' : ''}" onclick="document.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));this.classList.add('on')"><input type="radio" name="mode" value="${k}" ${i === 0 ? 'checked' : ''} style="display:none"><span class="em">${e}</span><div class="t">${t}</div><div class="d">${d}</div></label>`).join('')}</div>
      <div class="alertbox y" style="margin-top:14px"><span class="em">📝</span><div>Cada cambio queda registrado en la cronología de entradas y salidas (kardex).</div></div>`,
    onSubmit: f => {
      let n = 0;
      if (f.mode === 'inicializar') S.products.forEach(p => { if (!(p.id in c.counts) && p.stock !== 0) { const q = -p.stock; p.stock = 0; kardexLog(p.id, 'captura', q, c.code, 'Inicialización de inventario', p.cost); n++; } });
      Object.entries(c.counts).forEach(([pid, cnt]) => { const p = S.products.find(x => x.id === pid); if (!p) return; const before = p.stock; p.stock = f.mode === 'sumar' ? p.stock + cnt : cnt; const q = p.stock - before; if (q) { kardexLog(p.id, 'captura', q, c.code, 'Captura física (' + f.mode + ')', p.cost); n++; } });
      c.applied = true; c.mode = f.mode; c.appliedAt = nowISO(); save('captures', 'products', 'kardex'); closeModal(); render(); toast(nfmt(n) + ' tarjeta(s) ajustadas', '✅');
    } });
}
DOCS.captura = () => { const c = window._cap; if (!c) return null; const rows = S.products.filter(p => p.id in c.counts).map(p => [p.code, p.name, p.category || '', p.stock, c.counts[p.id], c.counts[p.id] - p.stock, (c.counts[p.id] - p.stock) * (p.cost || 0)]);
  return { title: 'Captura de inventario · ' + c.name, subtitle: `${dmy(c.date)} · ${c.who || ''} · ${c.applied ? 'Aplicada (' + c.mode + ')' : 'Abierta'}`, columns: ['Referencia', 'Producto', 'Grupo', 'Sistema', 'Contado', 'Diferencia', 'Valor dif.'], rows, totals: ['TOTAL', '', '', rows.reduce((a, r) => a + r[3], 0), rows.reduce((a, r) => a + r[4], 0), rows.reduce((a, r) => a + r[5], 0), rows.reduce((a, r) => a + r[6], 0)] }; };

let finF = { from: monthKey(today()) + '-01', to: today() };
function finData() {
  const { from, to } = finF;
  const ventas = S.sales.filter(v => v.status !== 'anulada' && v.date >= from && v.date <= to);
  const servs = S.services.filter(s => s.deliveredAt && String(s.deliveredAt).slice(0, 10) >= from && String(s.deliveredAt).slice(0, 10) <= to);
  const gastos = S.expenses.filter(g => g.date >= from && g.date <= to && g.category !== 'Inventario');
  const vProd = ventas.reduce((a, v) => a + v.total, 0), vServ = servs.reduce((a, s) => a + (s.total || 0), 0);
  const cProd = ventas.reduce((a, v) => a + (v.items || []).reduce((b, i) => b + i.qty * (i.cost || 0), 0), 0), cServ = servs.reduce((a, s) => a + (s.cost || 0), 0);
  const desc = ventas.reduce((a, v) => a + (v.discount || 0), 0);
  const gCat = {}; gastos.forEach(g => gCat[g.category] = (gCat[g.category] || 0) + g.amount);
  const gTot = gastos.reduce((a, g) => a + g.amount, 0);
  const gar = S.warranties.filter(w => w.date >= from && w.date <= to).reduce((a, w) => a + (w.cost || 0), 0);
  const secc = {}; ventas.forEach(v => (v.items || []).forEach(i => { const k = i.category || 'General'; (secc[k] = secc[k] || { venta: 0, costo: 0, unid: 0 }); secc[k].venta += i.qty * i.price; secc[k].costo += i.qty * (i.cost || 0); secc[k].unid += i.qty; }));
  if (vServ) secc['Servicios'] = { venta: vServ, costo: cServ, unid: servs.length };
  const ingresos = vProd + vServ, costo = cProd + cServ, bruta = ingresos - costo, neta = bruta - gTot;
  /* balance simple */
  const caja = S.cashdays.filter(c => c.closedAt)[0], efectivo = openCash() ? (openCash().base + dayTotals(today()).efectivo) : (caja ? caja.counted : 0);
  const inv = S.products.reduce((a, p) => a + p.stock * (p.cost || 0), 0), cxc = carteraItems().reduce((a, i) => a + i.bal, 0), cxp = S.purchases.reduce((a, p) => a + (p.balance || 0), 0);
  const ivaV = ventas.reduce((a, v) => a + (v.iva || 0) + (v.items || []).reduce((b, i) => b + (i.iva ? i.qty * i.price * i.iva / (100 + i.iva) : 0), 0), 0);
  const ivaC = S.purchases.filter(p => p.date >= from && p.date <= to).reduce((a, p) => a + (p.ivaTotal || 0), 0);
  return { ventas, servs, vProd, vServ, cProd, cServ, desc, gCat, gTot, gar, secc, ingresos, costo, bruta, neta, efectivo, inv, cxc, cxp, ivaV, ivaC };
}

  return `<div class="card"><div class="card-h"><h3><span class="em">⬇️</span>Exportar tablas completas</h3><div class="spacer"></div><span class="tiny muted">Sin filtro de fechas · ideal para contador o backup</span></div><div class="card-b" style="display:grid;gap:8px">
    ${T.map(([k, t]) => `<div class="sortrow"><div style="flex:1"><b>${t}</b></div>${exportBtns('t_' + k)}</div>`).join('')}</div></div>`;
}
DOCS.t_productos = () => ({ title: 'Tabla de productos', columns: ['Referencia', 'Producto', 'Grupo', 'Marca', 'Presentación', 'IVA %', 'Costo', pLabel('p1'), pLabel('p2'), pLabel('p3'), 'Stock', 'Mínimo', 'Vendidos', 'Última recarga', 'Proveedor'], rows: S.products.map(p => [p.code, p.name, p.category || '', p.brand || '', p.presentation || '', p.iva || 0, p.cost || 0, p.price, p.price2 || 0, p.price3 || 0, p.stock, p.min || 0, p.sold || 0, dmy(p.lastRestock), p.supplier || '']) });
DOCS.t_clientes = DOCS.terceros;
DOCS.t_ventas = () => ({ title: 'Tabla de ventas', orientation: 'l', columns: ['Factura', 'Tipo', 'Fecha', 'Hora', 'Cliente', 'NIT', 'Vendedor', 'Subtotal', 'Descuento', 'IVA', 'Total', 'Medios', 'Estado', 'Motivo anulación'], rows: S.sales.map(v => [v.invoice || v.code, v.docType || 'POS', dmy(v.date), hm(v.at), v.clientName, v.nit || '', v.seller || '', v.subtotal, v.discount || 0, v.iva || 0, v.total, (v.payments || []).map(p => MEDIO_T[p.method] + ' ' + nfmt(p.amount)).join(' | '), v.status === 'anulada' ? 'ANULADA' : 'Válida', v.anulReason || '']) });
DOCS.t_detalleVentas = () => ({ title: 'Detalle de ítems vendidos', orientation: 'l', columns: ['Factura', 'Fecha', 'Cliente', 'Referencia', 'Producto', 'Grupo', 'Cantidad', 'Precio', 'Costo', 'Total', 'Utilidad', 'Estado'], rows: S.sales.flatMap(v => (v.items || []).map(i => [v.invoice || v.code, dmy(v.date), v.clientName, i.code || '', i.name, i.category || '', i.qty, i.price, i.cost || 0, i.qty * i.price, i.qty * (i.price - (i.cost || 0)), v.status === 'anulada' ? 'ANULADA' : 'Válida'])) });
DOCS.t_servicios = () => ({ title: 'Órdenes de servicio', orientation: 'l', columns: ['Código', 'Creada', 'Cliente', 'Teléfono', 'Asunto', 'Responsable', 'Prioridad', 'Entrega', 'Estado', 'Total', 'Abono', 'Saldo', 'Costo'], rows: S.services.map(s => [s.code, dmy(s.createdAt), s.clientName, s.phone || '', s.subject, s.assigned || '', s.priority || '', dmy(s.promise), EST_SERV[s.status].t, s.total || 0, s.advance || 0, (s.total || 0) - (s.advance || 0), s.cost || 0]) });
DOCS.t_creditos = () => ({ title: 'Separados y créditos', orientation: 'l', columns: ['Código', 'Tipo', 'Cliente', 'Teléfono', 'Artículos', 'Total', 'Interés', 'Abonado', 'Saldo', 'Cuotas', 'Periodicidad', 'Próxima cuota', 'Estado'], rows: S.credits.map(c => [c.code, c.type, c.clientName, c.phone || '', c.desc || '', c.grandTotal ?? c.total, c.interes || 0, creditPaid(c), creditBalance(c), c.installments || 0, c.freq || '', dmy(nextDue(c)), EST_CRED[c.status].t]) });
DOCS.t_gastos = () => ({ title: 'Gastos', columns: ['Código', 'Fecha', 'Categoría', 'Concepto', 'Proveedor', 'Medio', 'Comprobante', 'Valor'], rows: S.expenses.map(g => [g.code || '', dmy(g.date), g.category, g.concept, g.provider || '', g.method, g.ref || '', g.amount]), totals: ['TOTAL', '', '', '', '', '', '', S.expenses.reduce((a, g) => a + g.amount, 0)] });
DOCS.t_compras = DOCS.compras;
DOCS.t_kardexAll = () => ({ ...DOCS.kardex(), subtitle: 'Todo el histórico', rows: S.kardex.map(k => [dmy(k.date), hm(k.at), k.code, k.name, k.type, k.qty, k.before, k.after, k.cost, k.ref, k.note, k.who]) });
DOCS.t_cajas = () => ({ title: 'Cierres de caja', orientation: 'l', columns: ['Fecha', 'Responsable', 'Base', 'Ingresos', 'Gastos', 'Efectivo', 'Digital', 'Esperado', 'Contado', 'Diferencia', 'Observación'], rows: S.cashdays.filter(c => c.closedAt).map(c => [dmy(c.id), c.who || '', c.base, c.income, c.expense, c.cash, c.digital, c.expected, c.counted, c.diff, c.obs || '']) });
DOCS.t_garantias = DOCS.garantias;

/* ---------------- CONFIG: DIAN, precios, POS ---------------- */
const _cfgBase = VIEWS.config;
VIEWS.config = () => _cfgBase() + `<div class="row c2" style="align-items:start;margin-top:15px">
  <div class="card"><div class="card-h"><h3><span class="em">⚡</span>Facturación y DIAN</h3></div><div class="card-b">
    <p class="tiny muted" style="margin-top:0">Numeración autorizada. La factura POS se numera y se imprime aquí. Para <b>factura electrónica</b> el sistema genera número, CUFE (SHA-384) y el paquete de datos; la transmisión a la DIAN requiere un proveedor tecnológico autorizado, que se conecta desde el backend.</p>
    ${['pos', 'fe'].map(k => { const r = S.config.res[k]; return `<div class="card" style="margin-bottom:12px;background:var(--grad-soft);border-color:var(--blue-100)"><div class="card-b">
      <div class="strong" style="margin-bottom:8px">${k === 'pos' ? '🧾 Resolución facturación POS' : '⚡ Resolución facturación electrónica'}</div>
      <div class="row c4"><label class="field" style="margin:0"><span>Prefijo</span><input type="text" id="r_${k}_prefijo" value="${esc(r.prefijo)}" maxlength="4"></label>
        <label class="field" style="margin:0"><span>Nº resolución</span><input type="text" id="r_${k}_resolucion" value="${esc(r.resolucion)}"></label>
        <label class="field" style="margin:0"><span>Desde</span><input type="number" id="r_${k}_desde" value="${r.desde}"></label>
        <label class="field" style="margin:0"><span>Hasta</span><input type="number" id="r_${k}_hasta" value="${r.hasta}"></label></div>
      <div class="row c3" style="margin-top:10px"><label class="field" style="margin:0"><span>Fecha resolución</span><input type="date" id="r_${k}_fecha" value="${r.fecha || ''}"></label>
        <label class="field" style="margin:0"><span>Vigencia hasta</span><input type="date" id="r_${k}_vigencia" value="${r.vigencia || ''}"></label>
        <label class="field" style="margin:0"><span>Último consecutivo usado</span><input type="number" id="r_${k}_actual" value="${r.actual || 0}"></label></div>
      ${k === 'fe' ? `<div class="row c3" style="margin-top:10px"><label class="field" style="margin:0"><span>Proveedor tecnológico</span><input type="text" id="r_fe_proveedor" value="${esc(r.proveedor || '')}" placeholder="Ej: Facture, Siigo, Alegra…"></label>
        <label class="field" style="margin:0"><span>Clave técnica / PIN</span><input type="text" id="r_fe_pin" value="${esc(r.pin || '')}"></label>
        <label class="field" style="margin:0"><span>Ambiente</span><select id="r_fe_ambiente"><option value="pruebas" ${r.ambiente !== 'produccion' ? 'selected' : ''}>Pruebas (habilitación)</option><option value="produccion" ${r.ambiente === 'produccion' ? 'selected' : ''}>Producción</option></select></label></div>` : ''}
      <div class="tiny muted" style="margin-top:8px">Usados ${nfmt((r.actual || 0) - (r.desde || 1) + 1 > 0 ? (r.actual || 0) - (r.desde || 1) + 1 : 0)} de ${nfmt((r.hasta || 0) - (r.desde || 1) + 1)} · ${r.vigencia && r.vigencia < addDays(today(), 30) ? '<b style="color:var(--bad)">⚠️ vence pronto</b>' : ''}</div></div></div>`; }).join('')}
    <label class="field"><span>Documento de consumidor final</span><input type="text" id="cCF" value="${esc(S.config.consumidorFinal)}"></label>
    <label class="field"><span>Pie del ticket</span><input type="text" id="cFoot" value="${esc(S.config.ticketFoot || '¡Gracias por su compra!')}"></label>
    <button class="btn primary" onclick="guardarDian()">Guardar facturación</button></div></div>
  <div class="grid"><div class="card"><div class="card-h"><h3><span class="em">🏷️</span>Listas de precios</h3></div><div class="card-b">
    ${['p1', 'p2', 'p3'].map(k => `<label class="field"><span>Nombre de ${k === 'p1' ? 'precio 1 (público)' : k === 'p2' ? 'precio 2 (mayorista)' : 'precio 3'}</span><input type="text" id="pl_${k}" value="${esc(pLabel(k))}"></label>`).join('')}
    <div class="row c2"><label class="field"><span>IVA por defecto en productos nuevos</span><select id="cIvaDef">${[0, 5, 19].map(v => `<option value="${v}" ${(S.config.ivaDefault || 0) == v ? 'selected' : ''}>${v}%</option>`).join('')}</select></label>
      <label class="field"><span>% comisión por defecto</span><input type="number" step=".5" id="cComPct" value="${S.config.comisionPct}"></label></div>
    <button class="btn primary" onclick="guardarDian()">Guardar</button></div></div>
  <div class="card"><div class="card-h"><h3><span class="em">🏭</span>Marcas</h3></div><div class="card-b"><div class="chips">${(S.config.marcas || []).map(m => `<span class="chipx">${esc(m)} <span onclick="S.config.marcas=S.config.marcas.filter(x=>x!==${JSON.stringify(m)});save('config');render()" style="cursor:pointer;opacity:.6">✕</span></span>`).join('') || '<span class="tiny muted">Se crean al escribirlas en la tarjeta Kardex</span>'}</div></div></div></div></div>`;
function guardarDian() {
  ['pos', 'fe'].forEach(k => { const r = S.config.res[k]; ['prefijo', 'resolucion', 'fecha', 'vigencia'].forEach(f => { const e = $('#r_' + k + '_' + f); if (e) r[f] = e.value; }); ['desde', 'hasta', 'actual'].forEach(f => { const e = $('#r_' + k + '_' + f); if (e) r[f] = Number(e.value) || 0; }); if (k === 'fe') { r.proveedor = $('#r_fe_proveedor')?.value || ''; r.pin = $('#r_fe_pin')?.value || ''; r.ambiente = $('#r_fe_ambiente')?.value || 'pruebas'; } });
  S.config.consumidorFinal = $('#cCF')?.value || '222222222222'; S.config.ticketFoot = $('#cFoot')?.value || '';
  S.config.precios = { p1: $('#pl_p1')?.value || 'Precio público', p2: $('#pl_p2')?.value || 'Precio mayorista', p3: $('#pl_p3')?.value || 'Precio 3' };
  S.config.ivaDefault = Number($('#cIvaDef')?.value) || 0; S.config.comisionPct = Number($('#cComPct')?.value) || 0;
  save('config'); render(); toast('Facturación guardada', '⚡');
}

</script>
</body>
</html>
